name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ── Install git if not present ────────────────────────
            if ! command -v git &>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            # ── Pull latest code ──────────────────────────────────
            REPO_DIR="$HOME/portfolio"
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" pull origin main 
            else
              git clone https://github.com/yassir420/Portofolio.git "$REPO_DIR"
            fi

            # ── Build image on EC2 ────────────────────────────────
            sudo docker build -t portfolio:latest "$REPO_DIR"

            # ── Swap container ────────────────────────────────────
            sudo docker stop portfolio 2>/dev/null || true
            sudo docker rm   portfolio 2>/dev/null || true
            sudo docker run -d \
              --name portfolio \
              --restart unless-stopped \
              -p 80:3000 \
              portfolio:latest

            # ── Clean up old images ───────────────────────────────
            sudo docker image prune -f

            echo "[deploy] Done."