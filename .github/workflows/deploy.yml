name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -euo pipefail

            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git curl
            elif ! command -v curl >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y curl
            fi

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
            fi

            sudo systemctl enable docker
            sudo systemctl start docker

            REPO_DIR="$HOME/portfolio"
            REPO_URL="https://github.com/yassiramrie/Portofolio.git"

            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" fetch origin
              git -C "$REPO_DIR" checkout main
              git -C "$REPO_DIR" pull --ff-only origin main
            else
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi

            PUBLIC_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
            touch .env
            grep -v '^NEXT_PUBLIC_SITE_URL=' .env > .env.tmp || true
            printf 'NEXT_PUBLIC_SITE_URL=http://%s\n' "$PUBLIC_IP" >> .env.tmp
            mv .env.tmp .env

            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f

            echo "[deploy] Done."