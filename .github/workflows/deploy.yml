name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ── Install Docker if not present (clean Ubuntu 24) ──
            if ! command -v docker &>/dev/null; then
              echo "[deploy] Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io \
                docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ubuntu
            fi

            # ── Install git if not present ────────────────────────
            if ! command -v git &>/dev/null; then
              sudo apt-get install -y git
            fi

            # ── Pull latest code ──────────────────────────────────
            REPO_DIR="$HOME/portfolio"
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" pull origin main
            else
              git clone https://github.com/yassir420/Portofolio.git "$REPO_DIR"
            fi

            # ── Build image on EC2 ────────────────────────────────
            sudo docker build -t portfolio:latest "$REPO_DIR"

            # ── Swap container ────────────────────────────────────
            sudo docker stop portfolio 2>/dev/null || true
            sudo docker rm   portfolio 2>/dev/null || true
            sudo docker run -d \
              --name portfolio \
              --restart unless-stopped \
              -p 80:3000 \
              portfolio:latest

            # ── Clean up old images ───────────────────────────────
            sudo docker image prune -f

            echo "[deploy] Done."
